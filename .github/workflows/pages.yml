name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write Supabase config from repository variables
        if: ${{ vars.SUPABASE_URL != '' }}
        run: |
          cat > config.js <<CFG
          window.SNB_CONFIG = { SUPABASE_URL: "${{ vars.SUPABASE_URL }}", SUPABASE_ANON_KEY: "${{ vars.SUPABASE_ANON_KEY }}" };
          CFG
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
